#ddev-generated
services:
  solr:
    image: ${SOLR_BASE_IMAGE:-solr:9}-${DDEV_SITENAME}-built
    build:
      dockerfile_inline: |
        ARG SOLR_BASE_IMAGE="scratch"
        FROM $$SOLR_BASE_IMAGE
        # Fix HTTPS redirect to HTTP which breaks URL for Solr Admin UI.
        # The reason for this problem is that Solr uses Jetty as a webserver.
        # Jetty has X-Forwarded- headers disabled by default, enable them here:
        USER root
        RUN sed -i '/X-Forwarded-/,/-->/ {/<!--/d; /-->/d}' /opt/solr/server/etc/jetty.xml
        # Use predefined values for username/password in Solr Admin UI.
        RUN sed -i "/\$$rootScope.exceptions = {};/a \$$scope.username = 'solr'; \$$scope.password = 'SolrRocks';" /opt/solr/server/solr-webapp/webapp/js/angular/controllers/login.js
        # Solr 10+ deprecates the basicauth system property in favor of solr.security.auth.basicauth.credentials
        RUN case "$$(readlink -f /opt/solr)" in */solr-[89].*) ;; *) echo 'SOLR_AUTHENTICATION_OPTS="$${SOLR_AUTHENTICATION_OPTS//-Dbasicauth=/-Dsolr.security.auth.basicauth.credentials=}"' >> /etc/default/solr.in.sh ;; esac
        # Java 24+ warns about sun.misc.Unsafe usage by libraries of the Solr CLI
        RUN if java --sun-misc-unsafe-memory-access=allow -version >/dev/null 2>&1; then echo 'SOLR_TOOL_OPTS="$${SOLR_TOOL_OPTS:-} --sun-misc-unsafe-memory-access=allow"' >> /etc/default/solr.in.sh; fi
        USER solr
      args:
        SOLR_BASE_IMAGE: ${SOLR_BASE_IMAGE:-solr:9}
    container_name: ddev-${DDEV_SITENAME}-solr
    expose:
      - 8983
    labels:
      com.ddev.site-name: ${DDEV_SITENAME}
      com.ddev.approot: ${DDEV_APPROOT}
    environment:
      # Solr 8 and 9 start in standalone mode without it, Solr 10+ uses SolrCloud by default
      SOLR_MODE: solrcloud
      SOLR_HOST: ddev-${DDEV_SITENAME}-solr
      SOLR_PORT: 8983
      # The pre-trained OpenNLP models require a much bigger buffer.
      SOLR_OPTS: -Djute.maxbuffer=50000000
      #SOLR_HEAP: 1g
      SOLR_AUTH_TYPE: basic
      SOLR_AUTHENTICATION_OPTS: -Dbasicauth=solr:SolrRocks
      # Explicitly use the default ZooKeeper ACL classes to avoid "OPEN_ACL_UNSAFE" warnings
      SOLR_ZK_CREDS_AND_ACLS: -DzkACLProvider=org.apache.solr.common.cloud.DefaultZkACLProvider -DzkCredentialsInjector=org.apache.solr.common.cloud.DefaultZkCredentialsInjector
      # needed for Drupal Search API Solr
      SOLR_MODULES: ${SOLR_MODULES-extraction,langid,ltr,analysis-extras}
      VIRTUAL_HOST: ${DDEV_HOSTNAME}
      HTTP_EXPOSE: 8983:8983
      HTTPS_EXPOSE: 8943:8983
    volumes:
      - .:/mnt/ddev_config
      - ddev-global-cache:/mnt/ddev-global-cache
      - ./solr/lib:/opt/solr/modules/ddev/lib
      - solr:/var/solr
    command:
      - bash
      - -c
      - |
        set -eu -o pipefail
        rm -f /tmp/solr-ready
        # Initialize Solr in the background once it is up, the healthcheck passes after that
        (
          until curl -s -o /dev/null localhost:8983/solr/; do sleep 1; done
          solr zk cp file:/mnt/ddev_config/solr/security.json zk:/security.json -z localhost:9983
          cd /mnt/ddev_config/solr/configsets
          for dir in */; do
            dir="$${dir%/}"
            if [[ "$$dir" != "*" ]]; then
              echo "uploading configset $$dir"
              solr zk upconfig -n "$$dir" -d "$$dir" -z localhost:9983
              echo "creating collection $$dir"
              solr create -c "$$dir" -n "$$dir" -shards 1 -rf 1 || true
            fi
          done
          touch /tmp/solr-ready
        ) &
        exec docker-entrypoint.sh solr-foreground -Dlog4j.configurationFile=/opt/solr/server/resources/log4j2.xml
    healthcheck:
      test: ["CMD-SHELL", "test -f /tmp/solr-ready && curl --fail -s localhost:8983/solr/"]
    x-ddev:
      describe-info: |
        User: solr
        Pass: SolrRocks
        Image: ${SOLR_BASE_IMAGE:-solr:9}
      ssh-shell: bash
volumes:
  solr:
